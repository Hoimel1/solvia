# SOLVIA Configuration File
# Evidence-based parameters for hemolytic toxicity prediction

# General settings
project:
  name: "SOLVIA"
  version: "1.0.0"
  description: "In-silico hemolytic toxicity screening for antimicrobial peptides"

# Directory structure
directories:
  simulations_base: "/home/michelhuller/solvia/simulations"
  data_base: "/home/michelhuller/solvia/data"
  templates: "/work/data/templates"
  force_fields: "/work/force_fields"
  scripts: "/home/michelhuller/solvia/scripts/universal"

# ColabFold parameters
colabfold:
  num_models: 5
  num_replicates: 3
  min_plddt: 80  # Minimum pLDDT score to proceed
  msa_mode: "mmseqs2_uniref_env"
  pair_mode: "unpaired_paired"
  relax: false

# Martinize2 parameters
coarse_graining:
  force_field: "martini3001"
  c_terminal: "NH2-ter"  # Amidated C-terminus
  dssp: true  # Use DSSP for secondary structure (installed in martinize image)
  elastic_network: false
  position_restraints: true
  restraint_force: 1000

# RBC membrane parameters (evidence-based from concept)
membrane:
  type: "asymmetric_rbc"
  box_size: [12, 12, 14]  # nm (in-plane enlarged per QC)
  thickness: 4.5  # nm (physiological)
  
  # Outer leaflet composition
  upper_leaflet:
    POPC: 0.40  # 40% (physiological RBC outer leaflet)
    PSM: 0.15   # 15% (sphingomyelin)
    CHOL: 0.45  # 45% (cholesterol - high for RBC membrane)
  
  # Inner leaflet composition  
  lower_leaflet:
    POPE: 0.45  # 45% (phosphatidylethanolamine)
    POPS: 0.15  # 15% (phosphatidylserine - negatively charged)
    CHOL: 0.40  # 40% (cholesterol - slightly lower than outer)
  
  # Solvent and ions
  solvent: "W"  # Water
  salt_concentration: 0.15  # 150 mM (physiological)

# Peptide insertion parameters
peptide_insertion:
  arrangement: "3-2-3"  # 3 rows: 3 peptides, 2 peptides, 3 peptides
  total_peptides: 8  # Standard occupancy
  distance_from_membrane: 3.0  # nm above membrane surface
  minimum_spacing: 2.5  # nm between peptides
  # Optional z-jitter to diversify initial z placement (nm)
  z_jitter:
    mode: none          # none | normal | uniform
    std_nm: 0.0         # used if mode=normal
    range_nm: 0.0       # half-range, used if mode=uniform
    per_peptide: false  # if true, sample per peptide; else per replicate
  # Thermodynamic placement (optional)
  thermo:
    d_opt: 1.8        # nm preferred neighbor distance (cooperative)
    cutoff: 2.5       # nm interaction cutoff
    mc_steps: 2000    # Monte Carlo refinement steps
    step_sigma: 0.1   # nm proposal stddev
    sigma_frac: 0.15      # Gaussian well width as fraction of d_opt
    repulsion_exponent: 12.0
    repulsion_scale: 1.0
    attraction_scale: 1.0
    # Per-residue transfer energies (kJ/mol); overrides internal defaults if provided
    # energies_kj:
    #   W: -12.3
    #   F: -7.8
    #   L: -4.2
    #   I: -4.5
    #   Y: -5.3
    #   V: -3.5
    #   M: -2.5
    #   A: 0.7
    #   G: 1.0
    #   S: 3.7
    #   T: 2.7
    #   P: 3.0
    #   H: 4.6
    #   N: 8.6
    #   Q: 9.2
    #   D: 10.5
    #   E: 8.2
    #   K: 10.0
    #   R: 12.3
  
  # Multi-occupancy levels for testing
  occupancy_levels:
    low: 8     # P:L ratio ~1:42
    medium: 12 # P:L ratio ~1:28
    high: 16   # P:L ratio ~1:21
  # Cooperative (non-thermo) placement defaults
  cooperative:
    d_opt: 1.8
    cutoff: 2.5
    mc_steps: 2000
    step_sigma: 0.1
    sigma_frac: 0.15
    repulsion_exponent: 12.0
    repulsion_scale: 1.0
    attraction_scale: 1.0

# MD simulation parameters
simulation:
  timestep: 0.02  # 20 fs for Martini
  temperature: 310  # K (physiological)
  pressure: 1.0  # bar
  
  # Equilibration steps
  em:
    emtol: 100
    nsteps: 50000
  
  nvt:
    time: 50  # ps
    tau_t: 1.0
  
  npt:
    time: 100  # ps
    tau_t: 1.0
    tau_p: 12.0
    compressibility: 4.5e-5
  
  # Production run
  production:
    time: 400  # ns (increased from 200 ns)
    output_frequency: 100  # ps
    analysis_fraction: 0.2  # Analyze last 20% of trajectory

# ML parameters
machine_learning:
  toxic_threshold: 100  # HC50 ≤ 100 µM = toxic
  test_split: 0.15
  validation_split: 0.15
  random_seed: 42
  
# Performance parameters
performance:
  cpu_threads: 8
  gpu: true
  max_warnings: 2
  # Optional: Override GROMACS binary name (e.g., gmx_mpi on HPC clusters)
  gmx_cmd: "gmx"

pmf:
  strategy: variable            # uniform | variable | condensed
  spring_k: 700                 # kJ/mol/nm^2
  time_per_window_ns: 15
  # Headgroup atom names used to define membrane planes (upper/lower)
  # For Martini CG typically ["PO4"], for some AA force fields ["P"] may be used
  plane_atom_names: ["PO4", "P"]
  # Optional: Tuning der variablen Gitter-Erzeugung
  bulk_max_nm: 2.4
  bulk_min_nm: 2.2
  bulk_extra_nm: 2.6            # optional zusätzliches Bulk-Fenster
  dense_max_nm: 0.6
  dense_min_nm: -0.6
  dense_step_nm: 0.15
  coarse_step_nm: 0.2
  end_nm: -1.4
  # Oder komplette manuelle Liste
  # window_centers: [2.4, 2.2, 2.0, 1.8, ... , -1.4]
  
  # Optional: Robustere Peptid-Erkennung (falls unübliche Residue-/Atomnamen)
  # Wenn gesetzt, überschreibt die Heuristik komplett bzw. wird zuerst versucht
  # peptide_resnames: ["PEP", "PPT"]        # Liste von Residue-Namen (case-insensitive)
  # peptide_resname_regex: "^PEP.*$"         # Regex auf Residue-Namen
  # peptide_atomnames: ["BB", "SC1"]        # Liste von Atomnamen, falls CG-Mappings genutzt werden
  # exclude_resnames: ["SOL", "NA", "CL"]  # Zusätzliche auszuschließende Klassen (Wasser/Ionen/Lipide)
  # lipid_resnames: ["POPC", "POPE", "POPS", "CHOL", "PSM"]
  # peptide_min_atoms: 5
  # peptide_max_atoms: 5000
  
  # New umbrella/QC settings aligned with pmf_standard_config
  umbrella:
    ref_mode: "patch"
    consistent_reference: true   # Use same reference group for all windows
    patch_radius: 2.0            # nm around peptide COM (for LocalPatch)
    # Provide force_constant for runner compatibility (mirrors spring_k if used)
    force_constant: 700          # kJ/mol/nm^2
  
  qc:
    # QC thresholds aligned with pmf_standard_config
    min_neighbor_overlap: 0.10   # Hard minimum for adjacent window overlap
    target_overlap: 0.20         # Target for auto-densification
    min_ess_frames: 200          # Effective sample size threshold
    half_energy_tol_kj: 2.0      # Half-time energy difference tolerance (kJ/mol)
    max_qc_rounds: 3             # Densify/extend cycles
    auto_extend: true            # Automatically extend failing windows
    extend_ns: 10.0              # Per-iteration extension
    max_extend_ns: 20.0          # Cap per window
    discard_fraction: 0.10       # Discard initial 10% for QC (ESS/half-energy)
